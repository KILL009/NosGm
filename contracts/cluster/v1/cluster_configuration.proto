syntax = "proto3";

package nosgm.cluster.v1;

option csharp_namespace = "NosGm.Cluster.Wire.V1";

import "cluster_control.proto";

// Authoritative Configuration transport for the NosGM cluster.
// Authentication and role authorization are carried by mTLS identity rather
// than a Configuration RPC shared secret.
service ClusterConfiguration {
  // World reads the active snapshot. Master may also read it to make cold-boot
  // seeding idempotent and preserve live state across a Master restart.
  rpc GetConfiguration(GetConfigurationRequest)
      returns (GetConfigurationResponse);
  // World publishes gameplay Configuration changes. Master may update only to
  // establish the initial snapshot when the Configuration runtime is empty.
  rpc UpdateConfiguration(UpdateConfigurationRequest)
      returns (UpdateConfigurationResponse);
  // World-only authoritative update stream. Worlds recover from a typed gRPC
  // snapshot and resume after the last observed generation. There is no SCS
  // Configuration callback or fallback transport.
  rpc SubscribeConfigurationUpdates(SubscribeConfigurationUpdatesRequest)
      returns (stream ConfigurationUpdateEnvelope);
  // Master-only operational surface. Runtime control is disabled unless the
  // Authentication process explicitly enables it at startup.
  rpc GetConfigurationRuntimeInfo(GetConfigurationRuntimeInfoRequest)
      returns (GetConfigurationRuntimeInfoResponse);
  rpc RestartConfigurationRuntime(RestartConfigurationRuntimeRequest)
      returns (RestartConfigurationRuntimeResponse);
}

enum ConfigurationResultCode {
  CONFIGURATION_RESULT_CODE_UNSPECIFIED = 0;
  CONFIGURATION_RESULT_CODE_SUCCESS = 1;
  CONFIGURATION_RESULT_CODE_INVALID_REQUEST = 2;
  CONFIGURATION_RESULT_CODE_UNAUTHORIZED = 3;
  CONFIGURATION_RESULT_CODE_CONFLICT = 4;
  CONFIGURATION_RESULT_CODE_UNAVAILABLE = 5;
}

message ConfigurationSnapshot {
  int64 max_gold = 1;
  int64 time_exp_buff_unix_time_ms = 2;
  int64 time_gold_buff_unix_time_ms = 3;
}

message GetConfigurationRequest {
  RequestContext context = 1;
}

message GetConfigurationResponse {
  ConfigurationResultCode result = 1;
  ConfigurationSnapshot configuration = 2;
  uint64 generation = 3;
  string runtime_generation_id = 4;
}

message UpdateConfigurationRequest {
  RequestContext context = 1;
  ConfigurationSnapshot configuration = 2;
}

message UpdateConfigurationResponse {
  ConfigurationResultCode result = 1;
  ConfigurationSnapshot configuration = 2;
  uint64 generation = 3;
  string runtime_generation_id = 4;
}

message SubscribeConfigurationUpdatesRequest {
  RequestContext context = 1;
  // Runtime identity returned by GetConfiguration. It changes on every
  // Configuration runtime start or guarded in-process restart so a numeric
  // generation is never reused across runtime windows accidentally.
  string runtime_generation_id = 2;
  // Last generation already observed by this World process. Newer retained
  // snapshots are replayed before live delivery begins.
  uint64 resume_after_generation = 3;
}

message ConfigurationUpdateEnvelope {
  ConfigurationSnapshot configuration = 1;
  uint64 generation = 2;
  string runtime_generation_id = 3;
  bool replayed = 4;
}

message GetConfigurationRuntimeInfoRequest {
  RequestContext context = 1;
}

message GetConfigurationRuntimeInfoResponse {
  ConfigurationResultCode result = 1;
  string runtime_generation_id = 2;
  int64 started_at_unix_time_ms = 3;
  uint64 configuration_generation = 4;
  bool seeded = 5;
  uint32 active_subscribers = 6;
  uint32 restart_count = 7;
  bool control_enabled = 8;
}

message RestartConfigurationRuntimeRequest {
  RequestContext context = 1;
  string expected_runtime_generation_id = 2;
}

message RestartConfigurationRuntimeResponse {
  ConfigurationResultCode result = 1;
  string previous_runtime_generation_id = 2;
  string runtime_generation_id = 3;
  int64 started_at_unix_time_ms = 4;
  uint64 configuration_generation = 5;
  uint32 active_subscribers = 6;
  uint32 restart_count = 7;
  bool control_enabled = 8;
}
