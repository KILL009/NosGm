# NosGM.ClientEnhancements profile template for the target client family.
# Run NosGM.ClientProbe.exe against your authorized local executable and use
# the generated exact version and SHA-256 values. Blank hashes are rejected.
profile_name=nosgm-client-0.9.3.3255
expected_file_version=0.9.3.3255
expected_sha256=REPLACE_WITH_64_CHARACTER_SHA256
# Only x86 is supported by the client-side module.
target_architecture=x86

# Foundation build. Diagnostics is active only after exact identity validation.
enable_diagnostics=true

# These features remain disabled until signatures for this exact executable
# are validated and covered by regression tests.
enable_discord_presence=false
enable_cooldown_labels=false
enable_fps_control=false
enable_resolution_manager=false
enable_minimized_rendering=false
