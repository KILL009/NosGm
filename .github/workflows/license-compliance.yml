name: License compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify attribution and notices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run repository compliance checks
        shell: pwsh
        run: ./scripts/verify-license-compliance.ps1

      - name: Verify NosGM.DataUpdater
        shell: pwsh
        run: ./scripts/verify-data-updater.ps1

      - name: Verify NosGM.TimeSpaceParser
        shell: pwsh
        run: ./scripts/verify-timespace-parser.ps1
