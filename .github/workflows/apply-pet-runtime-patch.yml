name: Apply pet runtime patch

on:
  push:
    branches:
      - fix/pet-combat-and-experience
    paths:
      - scripts/patches/pet-runtime.patch
      - .github/workflows/apply-pet-runtime-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/pet-combat-and-experience
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/patches/pet-runtime.patch
          git apply --whitespace=nowarn scripts/patches/pet-runtime.patch

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/NosGm.GameObject/Mate.cs
          git commit -m "Fix official pet stats, targeting range and EXP display"
          git push origin HEAD:fix/pet-combat-and-experience
