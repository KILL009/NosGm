name: NosGm identity guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nosgm-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Enforce NosGm technical identity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify NosGM and OpenNos identity
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'NosGm.sln' -PathType Leaf)) {
            Write-Error 'NosGm.sln is missing.'
            exit 1
          }

          $invalidMetadata = @(
            & git grep -n -I -i -E 'AssemblyCompany\("NosGm Team"\)|NosGm Team Copyright' -- '*.cs' 2>$null
          )

          if ($LASTEXITCODE -gt 1) {
            Write-Error 'git grep failed while checking assembly identity.'
            exit 1
          }

          if ($invalidMetadata.Count -gt 0) {
            Write-Error 'Outdated NosGM authorship metadata detected.'
            $invalidMetadata | Select-Object -First 100 | ForEach-Object { Write-Host $_ }
            exit 1
          }

          $readme = Get-Content -LiteralPath 'README.md' -Raw
          if ($readme -notmatch 'NosGM is an open-source NosTale server emulator derived from OpenNos') {
            Write-Error 'README.md must identify NosGM directly as an OpenNos-derived emulator.'
            exit 1
          }

          Write-Host 'NosGM technical identity and OpenNos provenance verified.'
