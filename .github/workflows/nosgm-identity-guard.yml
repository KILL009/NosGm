name: NosGm identity guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nosgm-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Enforce NosGm technical identity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify NosGM and OpenNos identity
        shell: pwsh
        run: |
          $requiredPaths = @(
            'NosGm.sln',
            'README.md',
            'AUTHORS.md',
            'NOTICE.md',
            'docs/PROVENANCE.md'
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Error "Required identity file is missing: $path"
              exit 1
            }
          }

          $requiredText = @{
            'README.md' = 'NosGM is an open-source NosTale server emulator derived from OpenNos.'
            'AUTHORS.md' = 'NosGM is a community-maintained NosTale server emulator derived from the OpenNos project.'
            'NOTICE.md' = 'NosGM is a modified work derived from the OpenNos project.'
            'docs/PROVENANCE.md' = 'NosGM is an OpenNos-derived emulator.'
          }

          foreach ($entry in $requiredText.GetEnumerator()) {
            $content = Get-Content -LiteralPath $entry.Key -Raw
            if (-not $content.Contains($entry.Value)) {
              Write-Error "$($entry.Key) is missing the required NosGM/OpenNos identity statement."
              exit 1
            }
          }

          Write-Host 'NosGM technical identity and OpenNos provenance verified.'
