name: Apply SP12 synchronization damage migration

on:
  push:
    branches:
      - feat/sp12-sync-damage-modifiers

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/sp12-sync-damage-modifiers
          fetch-depth: 0

      - name: Apply synchronization damage and BCard classification changes
        shell: python
        run: |
          from pathlib import Path

          # Subtype-aware classification prevents passive calculation BCards from
          # being reported as missing executable handlers.
          event_path = Path("Data/Frostvein.GameObject/Plugin/BCard/BCardEvent.cs")
          event_text = event_path.read_text(encoding="utf-8-sig")

          get_kind_marker = "        public static BCardExecutionKind GetKind(BCardType.CardType type)\n"
          get_kind_overload = """        public static BCardExecutionKind GetKind(BCardType.CardType type, byte subtype)
        {
            if (type == BCardType.CardType.StealBuff)
            {
                switch (subtype)
                {
                    case (byte)AdditionalTypes.StealBuff.IgnoreDefenceChance:
                    case (byte)AdditionalTypes.StealBuff.IgnoreDefenceChanceNegated:
                    case (byte)AdditionalTypes.StealBuff.ReduceCriticalReceivedChance:
                    case (byte)AdditionalTypes.StealBuff.ReduceCriticalReceivedChanceNegated:
                    case (byte)AdditionalTypes.StealBuff.ChanceSummonOnyxDragon:
                    case (byte)AdditionalTypes.StealBuff.ChanceSummonOnyxDragonNegated:
                        return BCardExecutionKind.PassiveCalculation;
                    default:
                        return BCardExecutionKind.Executable;
                }
            }

            return GetKind(type);
        }

"""
          if event_text.count(get_kind_marker) != 1:
              raise SystemExit("Could not locate BCardExecutionClassifier.GetKind")
          event_text = event_text.replace(get_kind_marker, get_kind_overload + get_kind_marker)

          passive_marker = "                case BCardType.CardType.SpecialDefence:\n"
          if event_text.count(passive_marker) != 1:
              raise SystemExit("Could not locate passive BCard switch")
          event_text = event_text.replace(
              passive_marker,
              "                case BCardType.CardType.SpecialAttack:\n" + passive_marker)

          old_passive_helper = """        public static bool IsPassiveCalculationOnly(BCardType.CardType type) =>
            GetKind(type) == BCardExecutionKind.PassiveCalculation;
"""
          new_passive_helper = """        public static bool IsPassiveCalculationOnly(BCardType.CardType type, byte subtype) =>
            GetKind(type, subtype) == BCardExecutionKind.PassiveCalculation;

        public static bool IsPassiveCalculationOnly(BCardType.CardType type) =>
            GetKind(type) == BCardExecutionKind.PassiveCalculation;
"""
          if event_text.count(old_passive_helper) != 1:
              raise SystemExit("Could not locate passive BCard helper")
          event_text = event_text.replace(old_passive_helper, new_passive_helper)
          event_path.write_text(event_text, encoding="utf-8")

          facility_path = Path("Data/Frostvein.GameObject/Plugin/PluginFacility.cs")
          facility_text = facility_path.read_text(encoding="utf-8-sig")
          old_classifier_call = "BCardExecutionClassifier.IsPassiveCalculationOnly(cardType)"
          new_classifier_call = "BCardExecutionClassifier.IsPassiveCalculationOnly(cardType, evnt.BCard.SubType)"
          if facility_text.count(old_classifier_call) != 1:
              raise SystemExit("Could not locate PluginFacility passive classifier call")
          facility_path.write_text(
              facility_text.replace(old_classifier_call, new_classifier_call),
              encoding="utf-8")

          hit_path = Path("Data/Frostvein.GameObject/Battle/HitRequest.cs")
          hit_text = hit_path.read_text(encoding="utf-8-sig")

          old_calculation = """            DateTime startedAtUtc = DateTime.UtcNow;
            int finalDamage = helper.CalculateDamage(attacker, defender, skill, ref hitMode,
                ref onyxWings, ref zephyrWings, ref dragonBuff, attackGreaterDistance);
            DateTime completedAtUtc = DateTime.UtcNow;
"""
          new_calculation = """            DateTime startedAtUtc = DateTime.UtcNow;
            int legacyDamage = helper.CalculateDamage(attacker, defender, skill, ref hitMode,
                ref onyxWings, ref zephyrWings, ref dragonBuff, attackGreaterDistance);
            ModernSpecialistDamageAdjustment synchronizationAdjustment =
                ModernSpecialistDamageModifier.Apply(attacker, defender, legacyDamage);
            int finalDamage = synchronizationAdjustment.FinalDamage;
            DateTime completedAtUtc = DateTime.UtcNow;

            if (synchronizationAdjustment.HasChanges)
            {
                Logger.Info(
                    $"[SP_SYNC_DAMAGE] CastId={FormatCastId(hitContext)} " +
                    $"SkillVNum={skill?.SkillVNum.ToString() ?? \"-\"} " +
                    $"Attacker={attacker?.MapEntityId ?? 0} Defender={defender?.MapEntityId ?? 0} " +
                    $"Legacy={legacyDamage} SyncAttackLevel={synchronizationAdjustment.AttackerSynchronizationLevel} " +
                    $"SyncAttackPercent={synchronizationAdjustment.SynchronizationAttackPercent} " +
                    $"SyncAttackBonus={synchronizationAdjustment.SynchronizationAttackBonus} " +
                    $"HeroAttackPercent={synchronizationAdjustment.HeroAttackPercent} " +
                    $"HeroAttackBonus={synchronizationAdjustment.HeroAttackBonus} " +
                    $"DefenderSyncLevel={synchronizationAdjustment.DefenderSynchronizationLevel} " +
                    $"SyncDefencePercent={synchronizationAdjustment.SynchronizationDefencePercent} " +
                    $"SyncDefenceReduction={synchronizationAdjustment.SynchronizationDefenceReduction} " +
                    $"Final={finalDamage}");
            }
"""
          if hit_text.count(old_calculation) != 1:
              raise SystemExit("Could not locate structured damage calculation block")
          hit_text = hit_text.replace(old_calculation, new_calculation)

          old_breakdown = """                Breakdown = new DamageBreakdown
                {
                    FinalDamage = finalDamage,
                    IsComplete = false
                }
"""
          new_breakdown = """                Breakdown = new DamageBreakdown
                {
                    LegacyDamage = legacyDamage,
                    SynchronizationAttackBonus = synchronizationAdjustment.SynchronizationAttackBonus,
                    HeroAttackBonus = synchronizationAdjustment.HeroAttackBonus,
                    SynchronizationDefenceReduction = synchronizationAdjustment.SynchronizationDefenceReduction,
                    BonusDamage = synchronizationAdjustment.TotalAttackBonus == 0
                        ? (int?)null
                        : synchronizationAdjustment.TotalAttackBonus,
                    DamageReduction = synchronizationAdjustment.SynchronizationDefenceReduction == 0
                        ? (int?)null
                        : synchronizationAdjustment.SynchronizationDefenceReduction,
                    FinalDamage = finalDamage,
                    IsComplete = false
                }
"""
          if hit_text.count(old_breakdown) != 1:
              raise SystemExit("Could not locate DamageBreakdown initializer")
          hit_text = hit_text.replace(old_breakdown, new_breakdown)

          hit_text = hit_text.replace(
              "                hitContext.RawDamage = finalDamage;\n",
              "                hitContext.RawDamage = legacyDamage;\n",
              1)
          hit_text = hit_text.replace(
              '        public string PipelineVersion => "legacy-adapter-v1";\n',
              '        public string PipelineVersion => "legacy-adapter-v2-sync";\n',
              1)

          breakdown_marker = """    public sealed class DamageBreakdown
    {
        public int? BaseDamage { get; set; }
"""
          breakdown_replacement = """    public sealed class DamageBreakdown
    {
        public int? LegacyDamage { get; set; }

        public int? SynchronizationAttackBonus { get; set; }

        public int? HeroAttackBonus { get; set; }

        public int? SynchronizationDefenceReduction { get; set; }

        public int? BaseDamage { get; set; }
"""
          if hit_text.count(breakdown_marker) != 1:
              raise SystemExit("Could not locate DamageBreakdown class")
          hit_text = hit_text.replace(breakdown_marker, breakdown_replacement)

          result_marker = """    /// <summary>
    /// Structured output of one damage calculation. During the migration the legacy formula fills
"""
          modifier_code = """    internal static class ModernSpecialistDamageModifier
    {
        public static ModernSpecialistDamageAdjustment Apply(
            BattleEntity attacker,
            BattleEntity defender,
            int legacyDamage)
        {
            if (legacyDamage <= 0)
            {
                return ModernSpecialistDamageAdjustment.Unchanged(legacyDamage);
            }

            ModernSpecialistSnapshot attackerSnapshot =
                AuthoritativeModernSpecialistStateStore.GetSnapshot(attacker?.Character);
            int synchronizationAttackPercent = attackerSnapshot.AttackPercentPerSynchronizationLevel *
                                               attackerSnapshot.SynchronizationLevel;
            int synchronizationAttackBonus = CalculatePercentage(legacyDamage, synchronizationAttackPercent);

            int heroAttackPercent = 0;
            Character heroOwner = attacker?.MapMonster?.Owner?.Character;
            if (heroOwner != null)
            {
                ModernSpecialistSnapshot heroOwnerSnapshot =
                    AuthoritativeModernSpecialistStateStore.GetSnapshot(heroOwner);
                heroAttackPercent = heroOwnerSnapshot.HeroAttackPercent;
            }

            int heroAttackBonus = CalculatePercentage(legacyDamage, heroAttackPercent);
            int damageAfterAttackBonuses = ClampDamage(
                (long)legacyDamage + synchronizationAttackBonus + heroAttackBonus);

            ModernSpecialistSnapshot defenderSnapshot =
                AuthoritativeModernSpecialistStateStore.GetSnapshot(defender?.Character);
            int synchronizationDefencePercent = defenderSnapshot.DefencePercentPerSynchronizationLevel *
                                                defenderSnapshot.SynchronizationLevel;
            int synchronizationDefenceReduction =
                CalculatePercentage(damageAfterAttackBonuses, synchronizationDefencePercent);
            int finalDamage = ClampDamage((long)damageAfterAttackBonuses - synchronizationDefenceReduction);

            return new ModernSpecialistDamageAdjustment
            {
                FinalDamage = finalDamage,
                AttackerSynchronizationLevel = attackerSnapshot.SynchronizationLevel,
                DefenderSynchronizationLevel = defenderSnapshot.SynchronizationLevel,
                SynchronizationAttackPercent = synchronizationAttackPercent,
                SynchronizationAttackBonus = synchronizationAttackBonus,
                HeroAttackPercent = heroAttackPercent,
                HeroAttackBonus = heroAttackBonus,
                SynchronizationDefencePercent = synchronizationDefencePercent,
                SynchronizationDefenceReduction = synchronizationDefenceReduction
            };
        }

        private static int CalculatePercentage(int value, int percent)
        {
            if (value <= 0 || percent <= 0)
            {
                return 0;
            }

            return ClampDamage((long)value * percent / 100);
        }

        private static int ClampDamage(long value)
        {
            if (value <= 0)
            {
                return 0;
            }

            return value >= int.MaxValue ? int.MaxValue : (int)value;
        }
    }

    internal sealed class ModernSpecialistDamageAdjustment
    {
        public int FinalDamage { get; set; }

        public int AttackerSynchronizationLevel { get; set; }

        public int DefenderSynchronizationLevel { get; set; }

        public int SynchronizationAttackPercent { get; set; }

        public int SynchronizationAttackBonus { get; set; }

        public int HeroAttackPercent { get; set; }

        public int HeroAttackBonus { get; set; }

        public int SynchronizationDefencePercent { get; set; }

        public int SynchronizationDefenceReduction { get; set; }

        public int TotalAttackBonus => SynchronizationAttackBonus + HeroAttackBonus;

        public bool HasChanges => TotalAttackBonus != 0 || SynchronizationDefenceReduction != 0;

        public static ModernSpecialistDamageAdjustment Unchanged(int damage) =>
            new ModernSpecialistDamageAdjustment { FinalDamage = damage };
    }

    private static string FormatCastId(HitContext hitContext) =>
        hitContext?.CastContext == null ? "-" : hitContext.CastContext.CastId.ToString("N");

"""
          # The helper must live inside DamageHelperStructuredExtensions. Insert it before that
          # class closes, then add the modifier classes after the class.
          extension_end = """            CombatDamageDiagnostics.Publish(result);
            return result;
        }
    }

"""
          extension_replacement = """            CombatDamageDiagnostics.Publish(result);
            return result;
        }

        private static string FormatCastId(HitContext hitContext) =>
            hitContext?.CastContext == null ? "-" : hitContext.CastContext.CastId.ToString("N");
    }

"""
          if hit_text.count(extension_end) != 1:
              raise SystemExit("Could not locate structured extension class end")
          hit_text = hit_text.replace(extension_end, extension_replacement)

          # Remove the standalone helper declaration from modifier_code because it was inserted
          # inside DamageHelperStructuredExtensions above.
          standalone_helper = """    private static string FormatCastId(HitContext hitContext) =>
        hitContext?.CastContext == null ? "-" : hitContext.CastContext.CastId.ToString("N");

"""
          modifier_code = modifier_code.replace(standalone_helper, "")
          if hit_text.count(result_marker) != 1:
              raise SystemExit("Could not locate DamageCalculationResult marker")
          hit_text = hit_text.replace(result_marker, modifier_code + result_marker)

          hit_path.write_text(hit_text, encoding="utf-8")

          Path(".github/workflows/apply-sp12-sync-damage.yml").unlink()

      - name: Commit synchronization damage migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply SP12 synchronization damage modifiers"
          git push origin HEAD:feat/sp12-sync-damage-modifiers
