name: Update BCard catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nosgm-bcard-data-updater
  cancel-in-progress: false

jobs:
  update:
    name: Extract and propose BCard data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NOSGAME_PACKAGE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      NOSGM_UPDATER_OWNER: ${{ github.repository_owner }}
      NOSGM_UPDATER_REPO: ${{ github.event.repository.name }}
      NOSGM_UPDATER_BASE_BRANCH: main
      NOSGM_UPDATER_REPOSITORY_ROOT: ${{ github.workspace }}
      NOSGM_UPDATER_OUTPUT_ROOT: Data/Generated/BCards
      NOSGM_UPDATER_LANGUAGES: ES,EN,DE,FR,IT,PL,CZ,RU,JP,CN

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Detect package access
        id: package_access
        shell: bash
        run: |
          if [ -z "$NUGET_AUTH_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic BCard extraction is skipped because NOSGAME_PACKAGE_TOKEN is not configured. Local mode remains available."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 9 and package source
        if: steps.package_access.outputs.available == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          source-url: https://nuget.pkg.github.com/noszanou/index.json

      - name: Restore updater with download adapter
        if: steps.package_access.outputs.available == 'true'
        run: dotnet restore Tools/NosGM.DataUpdater/NosGM.DataUpdater.csproj -p:EnableNosGamePackages=true

      - name: Build updater with download adapter
        if: steps.package_access.outputs.available == 'true'
        run: dotnet build Tools/NosGM.DataUpdater/NosGM.DataUpdater.csproj --configuration Release --no-restore -p:EnableNosGamePackages=true

      - name: Extract data and open pull request when changed
        if: steps.package_access.outputs.available == 'true'
        run: dotnet run --project Tools/NosGM.DataUpdater/NosGM.DataUpdater.csproj --configuration Release --no-build -p:EnableNosGamePackages=true -- --download-resources --publish
