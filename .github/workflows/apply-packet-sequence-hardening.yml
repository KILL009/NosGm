name: Apply packet sequence hardening

on:
  push:
    branches:
      - agent/nosgm-next-packet-sequence
    paths:
      - .github/workflows/apply-packet-sequence-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/nosgm-next-packet-sequence

      - name: Apply source transformation
        shell: pwsh
        run: ./scripts/apply-packet-sequence-hardening.ps1

      - name: Validate patch
        shell: pwsh
        run: |
          git diff --check
          if (-not (git status --short -- "Data/NosGm.GameObject/Networking/ClientSession.cs")) {
            throw "ClientSession.cs was not changed by the transformation."
          }

      - name: Commit source change
        shell: pwsh
        run: |
          git config user.name "NosGM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- "Data/NosGm.GameObject/Networking/ClientSession.cs"
          git commit -m "fix: enforce packet sequence ordering"
          git push origin HEAD:agent/nosgm-next-packet-sequence
