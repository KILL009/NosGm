name: Apply shared-region verifier update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/nosgm-gameforge-login-foundation'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply guarded verifier update
        shell: powershell
        run: ./scripts/apply-shared-region-world-guard.ps1

      - name: Commit verifier update
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-world-channel-lists.ps1
          if (git diff --cached --quiet) {
            Write-Host "No verifier changes to commit."
            exit 0
          }
          git commit -m "test: verify shared legacy and modern region flow"
          git push origin HEAD:${{ github.head_ref }}
