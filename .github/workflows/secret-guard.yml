name: Secret and backdoor guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Reject embedded credentials and high-risk execution patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan tracked text files
        shell: pwsh
        run: |
          $discordWebhook = 'https://(?:canary\.|ptb\.)?discord(?:app)?\.' +
                            'com/api/' + 'webhooks/[0-9]+/[A-Za-z0-9._-]+'
          $slackWebhook = 'https://hooks\.' + 'slack\.com/services/[A-Za-z0-9/_-]+'
          $telegramBot = 'https://api\.' + 'telegram\.org/bot[0-9]+:[A-Za-z0-9_-]+'
          $webhookSite = 'https?://(?:www\.)?webhook\.' + 'site/[0-9a-fA-F-]{32,36}'
          $pipedreamSink = 'https://[A-Za-z0-9-]+\.m\.' + 'pipedream\.net(?:/|$)'
          $githubClassicPat = 'gh' + '[pousr]_[A-Za-z0-9]{20,}'
          $githubFineGrainedPat = 'github_' + 'pat_[A-Za-z0-9_]{20,}'
          $powershellEncoded = '(?i)(?:power' + 'shell|pwsh)(?:\.exe)?[^\r\n]{0,160}\s-(?:enc|encodedcommand)\b'
          $downloadAndExecute = '(?i)(?:i' + 'ex|invoke-expression)[^\r\n]{0,200}(?:downloadstring|invoke-webrequest|\biwr\b|\bcurl\b|\bwget\b)'
          $shellPipe = '(?i)(?:curl|wget)[^\r\n]{0,240}\|\s*(?:sh|bash|zsh|power' + 'shell|pwsh)\b'

          $rules = @(
            @{ Name = 'Discord webhook credential'; Pattern = $discordWebhook },
            @{ Name = 'Slack webhook credential'; Pattern = $slackWebhook },
            @{ Name = 'Telegram bot API token'; Pattern = $telegramBot },
            @{ Name = 'webhook.site exfiltration sink'; Pattern = $webhookSite },
            @{ Name = 'Pipedream exfiltration sink'; Pattern = $pipedreamSink },
            @{ Name = 'GitHub classic token'; Pattern = $githubClassicPat },
            @{ Name = 'GitHub fine-grained token'; Pattern = $githubFineGrainedPat },
            @{ Name = 'PowerShell encoded command'; Pattern = $powershellEncoded },
            @{ Name = 'PowerShell download-and-execute'; Pattern = $downloadAndExecute },
            @{ Name = 'download piped directly to a shell'; Pattern = $shellPipe }
          )

          $hits = New-Object System.Collections.Generic.List[string]

          foreach ($file in (git ls-files)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }

            try {
              $content = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $file))
            }
            catch {
              continue
            }

            foreach ($rule in $rules) {
              if ([regex]::IsMatch($content, $rule.Pattern)) {
                $hits.Add("$($rule.Name): $file")
              }
            }
          }

          if ($hits.Count -gt 0) {
            $hits | Sort-Object -Unique | ForEach-Object { Write-Host "security finding: $_" }
            Write-Error "Potential embedded secret, exfiltration endpoint, or high-risk download/execute pattern detected. Review the findings before merging."
            exit 1
          }

          Write-Host "No blocked credentials, exfiltration sinks, or high-risk download/execute patterns detected."
