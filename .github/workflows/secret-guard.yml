name: Secret guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Reject embedded webhook credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan tracked text files
        shell: pwsh
        run: |
          $pattern = 'https://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/' +
                     'webhooks/[0-9]+/[A-Za-z0-9._-]+'
          $hits = New-Object System.Collections.Generic.List[string]

          foreach ($file in (git ls-files)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }

            try {
              $content = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $file))
            }
            catch {
              continue
            }

            if ([regex]::IsMatch($content, $pattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)) {
              $hits.Add($file)
            }
          }

          if ($hits.Count -gt 0) {
            Write-Error "Committed Discord webhook credentials were detected. Rotate the webhook and use environment variables instead."
            $hits | Sort-Object -Unique | ForEach-Object { Write-Host "credential detected in: $_" }
            exit 1
          }

          Write-Host "No embedded Discord webhook credentials detected."
