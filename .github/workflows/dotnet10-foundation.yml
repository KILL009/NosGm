name: .NET 10 foundation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dotnet10-foundation.yml"
      - "global.json"
      - "Web/**"
      - "Launcher/**"
      - "Tools/**"
      - "Data/NosGm.Domain/**"
      - "Data/NosGm.Algorithm/**"
      - "Data/NosGm.XMLModel/**"
      - "Data/NosGm.ChickenAPI/ChickenAPI.DAL/**"
      - "Data/NosGm.Configuration/**"
      - "Data/NosGm.DAL/NosGm.Data/**"
      - "Data/NosGm.PathFinder/**"
      - "Data/NosGm.PathFinder.Benchmark/**"
      - "Data/NosGm.Cluster.Contracts/**"
      - "Data/NosGm.Authentication.Client/**"
      - "Data/NosGm.Master.Library/**"
      - "Data/NosGm.Program/NosGm.Master.Server/**"
      - "Data/NosGm.Program/NosGm.Authentication.Server/**"
      - "contracts/cluster/**"
      - "tests/NosGm.Cluster.Contracts.SelfTest/**"
      - "tests/NosGm.Authentication.Runtime.SelfTest/**"
      - "docs/dotnet10-migration.md"
      - "docs/scs-transport-migration.md"
      - "docs/modern-login-local-runbook.md"
      - "docs/configuration-grpc-slice.md"
      - "scripts/new-local-authentication-certificates.ps1"
      - "scripts/start-modern-login-local.ps1"
      - "scripts/test-authentication-grpc-local.ps1"
      - "scripts/test-configuration-grpc-shadow-local.ps1"
      - "scripts/test-modern-login-readiness.ps1"
      - "scripts/verify-dotnet10-foundation.ps1"
      - "scripts/verify-scs-transport-contracts.ps1"
      - "scripts/verify-authentication-grpc-runtime.ps1"
      - "scripts/verify-authentication-grpc-local-acceptance.ps1"
      - "scripts/verify-configuration-grpc-shadow-acceptance.ps1"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dotnet10-foundation.yml"
      - "global.json"
      - "Web/**"
      - "Launcher/**"
      - "Tools/**"
      - "Data/NosGm.Domain/**"
      - "Data/NosGm.Algorithm/**"
      - "Data/NosGm.XMLModel/**"
      - "Data/NosGm.ChickenAPI/ChickenAPI.DAL/**"
      - "Data/NosGm.Configuration/**"
      - "Data/NosGm.DAL/NosGm.Data/**"
      - "Data/NosGm.PathFinder/**"
      - "Data/NosGm.PathFinder.Benchmark/**"
      - "Data/NosGm.Cluster.Contracts/**"
      - "Data/NosGm.Authentication.Client/**"
      - "Data/NosGm.Master.Library/**"
      - "Data/NosGm.Program/NosGm.Master.Server/**"
      - "Data/NosGm.Program/NosGm.Authentication.Server/**"
      - "contracts/cluster/**"
      - "tests/NosGm.Cluster.Contracts.SelfTest/**"
      - "tests/NosGm.Authentication.Runtime.SelfTest/**"
      - "docs/dotnet10-migration.md"
      - "docs/scs-transport-migration.md"
      - "docs/modern-login-local-runbook.md"
      - "docs/configuration-grpc-slice.md"
      - "scripts/new-local-authentication-certificates.ps1"
      - "scripts/start-modern-login-local.ps1"
      - "scripts/test-authentication-grpc-local.ps1"
      - "scripts/test-configuration-grpc-shadow-local.ps1"
      - "scripts/test-modern-login-readiness.ps1"
      - "scripts/verify-dotnet10-foundation.ps1"
      - "scripts/verify-scs-transport-contracts.ps1"
      - "scripts/verify-authentication-grpc-runtime.ps1"
      - "scripts/verify-authentication-grpc-local-acceptance.ps1"
      - "scripts/verify-configuration-grpc-shadow-acceptance.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet10-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET 10 islands and bridge libraries
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Show selected SDK
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info

      - name: Build Pathfinder benchmark through the production project
        shell: pwsh
        run: dotnet build "Data/NosGm.PathFinder.Benchmark/PathFinderBenchmark.csproj" --configuration Release --nologo

      - name: Run Pathfinder regression suite
        shell: pwsh
        run: >
          dotnet run
          --project "Data/NosGm.PathFinder.Benchmark/PathFinderBenchmark.csproj"
          --configuration Release
          --no-build

      - name: Verify inventory and build waves 0-2B
        shell: powershell
        run: ./scripts/verify-dotnet10-foundation.ps1

      - name: Verify Configuration shadow acceptance harness
        shell: powershell
        run: ./scripts/verify-configuration-grpc-shadow-acceptance.ps1

      - name: Create isolated authentication acceptance certificates
        shell: powershell
        run: ./scripts/new-local-authentication-certificates.ps1 -ManagedCertificateGenerator -KeyLength 2048

      - name: Verify live HTTP2 and gRPC-Web mTLS authentication
        shell: powershell
        run: ./scripts/test-authentication-grpc-local.ps1 -UseFileScopedRootTrust

      - name: Verify live net481 Configuration shadow transport
        timeout-minutes: 10
        shell: powershell
        run: |
          $manifest = Get-Content -LiteralPath "artifacts/authentication-grpc-local/manifest.json" -Raw | ConvertFrom-Json
          $rootCertificatePath = [System.IO.Path]::GetFullPath([string]$manifest.RootCertificatePath)
          $rootThumbprint = [string]$manifest.RootCertificateThumbprint
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
          $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($rootCertificatePath)
          $installedByStep = $false
          try {
            Write-Host "[TRUST] Opening CurrentUser Root store for Configuration net481 acceptance"
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $existing = @($store.Certificates | Where-Object { $_.Thumbprint -eq $rootThumbprint })
            if ($existing.Count -eq 0) {
              $store.Add($certificate)
              $installedByStep = $true
              Write-Host "[TRUST] Installed temporary NosGM development root without certificate-provider prompting" -ForegroundColor Green
            } else {
              Write-Host "[TRUST] NosGM development root is already trusted for CurrentUser"
            }
            ./scripts/test-configuration-grpc-shadow-local.ps1
          }
          finally {
            if ($installedByStep) {
              $store.Remove($certificate)
              Write-Host "[CLEANUP] Removed temporary NosGM development root" -ForegroundColor Green
            }
            $store.Close()
            $certificate.Dispose()
          }
