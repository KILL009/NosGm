name: Official packet contracts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-packets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify captured official packet layouts
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify official shop and crafting packet contracts
        shell: pwsh
        run: ./scripts/verify-official-shop-packet-layouts.ps1
