name: Apply PvE damage route migration

on:
  push:
    branches:
      - refactor/migrate-pve-damage-routes

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/migrate-pve-damage-routes
          fetch-depth: 0

      - name: Route PvE calculations through HitRequest
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("Data/Frostvein.GameObject/Map/MapMonster.cs"): (
                  """                var damage = DamageHelper.Instance.CalculateDamage(attackerBattleEntity, new BattleEntity(this),\n                    hitRequest.Skill, ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff);""",
                  """                DamageCalculationResult damageResult = hitRequest.CalculateDamage(attackerBattleEntity,\n                    new BattleEntity(this), ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff);\n                var damage = damageResult.FinalDamage;"""
              ),
              Path("Data/Frostvein.GameObject/Mate.cs"): (
                  """                var damage = DamageHelper.Instance.CalculateDamage(attackerBattleEntity, new BattleEntity(this),\n                    hitRequest.Skill, ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff, attackGreaterDistance);""",
                  """                DamageCalculationResult damageResult = hitRequest.CalculateDamage(attackerBattleEntity,\n                    new BattleEntity(this), ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff,\n                    attackGreaterDistance: attackGreaterDistance);\n                var damage = damageResult.FinalDamage;"""
              )
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one migration target in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          Path(".github/workflows/apply-pve-damage-route-migration.yml").unlink()

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate monster and mate damage routes"
          git push origin HEAD:refactor/migrate-pve-damage-routes
