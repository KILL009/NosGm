name: Event runtime contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/event-runtime-contracts.yml
      - Data/NosGm.GameObject/Event/EventContainer.cs
      - Data/NosGm.GameObject/Plugin/Event/**
      - Data/NosGm.Handler/PacketHandler/Mate/UpetPacketHandler.cs
      - scripts/verify-event-runtime-contracts.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/event-runtime-contracts.yml
      - Data/NosGm.GameObject/Event/EventContainer.cs
      - Data/NosGm.GameObject/Plugin/Event/**
      - Data/NosGm.Handler/PacketHandler/Mate/UpetPacketHandler.cs
      - scripts/verify-event-runtime-contracts.ps1

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify event runtime and Instant Battle contracts
        shell: pwsh
        run: ./scripts/verify-event-runtime-contracts.ps1
