name: Apply login password fallback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/nosgm-login-password-payload-fallback'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply guarded login password fallback
        shell: pwsh
        run: ./scripts/apply-login-password-payload-fallback.ps1

      - name: Commit generated handler change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/NosGm.Handler/PacketHandler/Login/LoginPacketHandler.cs
          if (git diff --cached --quiet) {
            Write-Host "No handler change to commit."
            exit 0
          }
          git commit -m "fix: accept plain and legacy password payloads"
          git push origin HEAD:${{ github.head_ref }}
