name: Pet combat contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pet-combat-contracts.yml
      - Data/NosGm.GameObject/AI/**
      - Data/NosGm.GameObject/Character.cs
      - Data/NosGm.GameObject/Mate.cs
      - scripts/verify-pet-combat-contracts.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/pet-combat-contracts.yml
      - Data/NosGm.GameObject/AI/**
      - Data/NosGm.GameObject/Character.cs
      - Data/NosGm.GameObject/Mate.cs
      - scripts/verify-pet-combat-contracts.ps1

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pet combat, tanking and experience contracts
        shell: pwsh
        run: ./scripts/verify-pet-combat-contracts.ps1

  compile:
    name: Compile pet AI project
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore GameObject project
        shell: pwsh
        run: dotnet restore ./Data/NosGm.GameObject/NosGm.GameObject.csproj

      - name: Build GameObject project
        shell: pwsh
        run: dotnet build ./Data/NosGm.GameObject/NosGm.GameObject.csproj --configuration Release --no-restore --property:Platform=AnyCPU
