name: Apply PvP damage route migration

on:
  push:
    branches:
      - refactor/migrate-pvp-damage-route

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/migrate-pvp-damage-route
          fetch-depth: 0

      - name: Route PvP calculations through HitRequest
        shell: python
        run: |
          from pathlib import Path

          path = Path("Data/Frostvein.Extension/Extension/Packet/BattleExt.cs")
          old = """                var damage = DamageHelper.Instance.CalculateDamage(battleEntity, battleEntityDefense, hitRequest.Skill,\n                    ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff);"""
          new = """                DamageCalculationResult damageResult = hitRequest.CalculateDamage(battleEntity, battleEntityDefense,\n                    ref hitmode, ref onyxWings, ref zephyrWings, ref dragonBuff);\n                var damage = damageResult.FinalDamage;"""

          text = path.read_text(encoding="utf-8-sig")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one PvP migration target, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/apply-pvp-damage-route-migration.yml").unlink()

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate PvP damage route"
          git push origin HEAD:refactor/migrate-pvp-damage-route
