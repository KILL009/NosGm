name: Validate RESX catalogs

on:
  push:
    branches:
      - main
      - fix/resx-localization-validation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-resx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair malformed catalogs on repair branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/resx-localization-validation') || (github.event_name == 'pull_request' && github.head_ref == 'fix/resx-localization-validation')
        run: python tools/validate_resx.py --repair

      - name: Validate all catalogs
        run: python tools/validate_resx.py

      - name: Commit repaired catalogs
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/resx-localization-validation') || (github.event_name == 'pull_request' && github.head_ref == 'fix/resx-localization-validation')
        run: |
          if git diff --quiet; then
            echo "No RESX repairs were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Frostvein.Program/Frostvein.World/Resource/LocalizedResources.*.resx
          git commit -m "fix(localization): repair malformed RESX comments"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
