name: NosGm source identity migration

on:
  push:
    branches:
      - refactor/nosgm-source-identity
    paths:
      - .github/identity-migration-trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/identity-migration-trigger.txt

permissions:
  contents: write

concurrency:
  group: nosgm-source-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Rename source identity and validate build
    if: github.event_name == 'push' || github.head_ref == 'refactor/nosgm-source-identity'
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      SOLUTION: NosGm.sln
      CONFIGURATION: Release
      PLATFORM: Any CPU
      ARTIFACTS: artifacts

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refactor/nosgm-source-identity

      - name: Check whether migration is needed
        id: migration-check
        shell: pwsh
        run: |
          if (Test-Path 'docs/NOSGM_IDENTITY_MIGRATION.md') {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'The source identity migration is already present on this branch.'
          }
          else {
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Configure Git identity
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run guarded identity migration
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: .github/scripts/Invoke-NosGmIdentityMigration.ps1

      - name: Show migration summary
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: |
          git status --short
          Get-Content docs/NOSGM_IDENTITY_MIGRATION.md

      - name: Set up Visual Studio MSBuild
        if: steps.migration-check.outputs.needed == 'true'
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Restore NuGet packages
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: nuget restore "$env:SOLUTION" -NonInteractive -Verbosity normal

      - name: Validate World resources after rename
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ARTIFACTS" | Out-Null
          $output = & msbuild "Data\NosGm.Program\NosGm.World\NosGm.World.csproj" `
            /t:PrepareResources `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform=AnyCPU `
            /bl:"$env:ARTIFACTS\identity-resx.binlog" `
            /fl `
            /flp:"logfile=$env:ARTIFACTS\identity-resx.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build complete renamed solution
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $output = & msbuild "$env:SOLUTION" `
            /t:Build `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform="$env:PLATFORM" `
            /bl:"$env:ARTIFACTS\identity-build.binlog" `
            /fl `
            /flp:"logfile=$env:ARTIFACTS\identity-build.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Commit core migration
        if: steps.migration-check.outputs.needed == 'true'
        shell: pwsh
        run: |
          # Workflow files are restored before publishing because GitHub protects
          # workflow mutations from this job token. They are migrated immediately
          # afterwards through the authenticated repository API.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add --all
          if (-not (git status --porcelain)) {
            throw "Identity migration produced no changes."
          }
          git commit -m "refactor: migrate complete source identity to NosGm"
          git push origin HEAD:refactor/nosgm-source-identity

      - name: Upload migration diagnostics
        if: always() && steps.migration-check.outputs.needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nosgm-identity-migration-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
