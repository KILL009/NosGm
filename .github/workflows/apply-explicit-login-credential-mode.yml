name: Apply explicit login credential mode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/nosgm-explicit-login-credential-mode'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply guarded credential mode changes
        shell: pwsh
        run: |
          try {
            ./scripts/apply-explicit-login-credential-mode.ps1
          }
          catch {
            $message = $_.Exception.Message
            Write-Host "::error::$message"
            Set-Content -LiteralPath ".github/credential-codemod-error.txt" -Value $message -Encoding UTF8
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/credential-codemod-error.txt
            if (-not (git diff --cached --quiet)) {
              git commit -m "chore: record credential codemod failure"
              git push origin HEAD:${{ github.head_ref }}
            }
            exit 1
          }

      - name: Commit generated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/NosGm.Configuration/ServerConfiguration.cs
          git add Data/NosGm.Core/Security/PasswordHashService.cs
          git add Data/NosGm.Handler/PacketHandler/Login/LoginPacketHandler.cs
          git add scripts/verify-password-hashing.ps1
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git commit -m "fix: make login credential mode explicit"
          git push origin HEAD:${{ github.head_ref }}
