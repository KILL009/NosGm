name: Validate NosGM.DataUpdater

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Tools/NosGM.DataUpdater/**'
      - '.github/workflows/update-bcard-catalogs.yml'
      - '.github/workflows/validate-data-updater.yml'
      - 'scripts/verify-data-updater.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-updater-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package-free .NET 9 core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore updater core
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet restore Tools/NosGM.DataUpdater/NosGM.DataUpdater.csproj --verbosity minimal 2>&1 | tee updater-restore.log

      - name: Build updater core
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build Tools/NosGM.DataUpdater/NosGM.DataUpdater.csproj --configuration Release --no-restore --verbosity minimal 2>&1 | tee updater-build.log

      - name: Upload updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nosgm-data-updater-diagnostics
          path: updater-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce updater validation result
        if: steps.restore.outcome != 'success' || steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "NosGM.DataUpdater restore or build failed. See the uploaded diagnostics artifact."
          exit 1
