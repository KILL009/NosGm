name: Validate NosGM Launcher

on:
  pull_request:
    paths:
      - "Launcher/**"
      - "Data/NosGm.Configuration/ServerConfiguration.cs"
      - "Data/NosGm.Program/NosGm.Master.Server/**"
      - "Data/NosGm.Program/NosGm.World/Properties/AssemblyInfo.cs"
      - "Web/src/NosGM.Web/Program.cs"
      - "Web/src/NosGM.Web.Contracts/PublicModels.cs"
      - "scripts/verify-launcher.ps1"
      - "scripts/verify-launcher-auth-bridge.ps1"
      - "scripts/verify-discord-rich-presence.ps1"
      - "scripts/verify-launcher-live-content.ps1"
      - ".github/workflows/validate-launcher.yml"
      - "AUTHORS.md"
      - "NOTICE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "docs/PROVENANCE.md"
      - "docs/LICENSING.md"
      - "docs/launcher-authentication.md"
      - "docs/discord-rich-presence.md"
      - "docs/launcher-live-content.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Launcher/NosGM.Launcher.sln

      - name: Build Release with quoted PATH entry
        id: launcher_build
        shell: pwsh
        run: |
          $log = Join-Path $PWD "launcher-build.log"
          $dotnet = (Get-Command dotnet.exe -ErrorAction Stop).Source
          $env:PATH = '"C:\Program Files\MySQL\MySQL Server 8.0\bin";' + $env:PATH
          & $dotnet build Launcher/NosGM.Launcher.sln --configuration Release --no-restore *> $log
          $exitCode = $LASTEXITCODE
          Get-Content $log
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Upload launcher build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-log
          path: launcher-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when launcher build failed
        if: steps.launcher_build.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Run updater synthetic regression test
        run: dotnet run --project Launcher/tests/NosGM.Updater.SelfTest/NosGM.Updater.SelfTest.csproj --configuration Release --no-build

      - name: Run Gameforge pipe protocol self-test
        run: dotnet run --project Launcher/tests/NosGM.GameforgePipe.SelfTest/NosGM.GameforgePipe.SelfTest.csproj --configuration Release

      - name: Run Steam client patcher self-test
        run: dotnet run --project Launcher/tests/NosGM.SteamClient.SelfTest/NosGM.SteamClient.SelfTest.csproj --configuration Release

      - name: Run launcher safety and attribution checks
        id: launcher_guard
        shell: pwsh
        run: |
          $log = Join-Path $PWD "launcher-guard.log"
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          & pwsh -NoLogo -NoProfile -File ./scripts/verify-launcher.ps1 *> $log
          $exitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          if (Test-Path $log) {
            Get-Content $log
          }
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Upload launcher guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-guard-log
          path: launcher-guard.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when launcher guard failed
        if: steps.launcher_guard.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Verify launcher authentication bridge contracts
        shell: pwsh
        run: ./scripts/verify-launcher-auth-bridge.ps1

      - name: Verify Discord Rich Presence contracts
        shell: pwsh
        run: ./scripts/verify-discord-rich-presence.ps1

      - name: Verify launcher live content contracts
        shell: pwsh
        run: ./scripts/verify-launcher-live-content.ps1
