name: Validate launcher diagnostics center

on:
  pull_request:
    paths:
      - "Launcher/src/NosGM.Launcher/LauncherDiagnostics.cs"
      - "Launcher/src/NosGM.Launcher/LauncherDiagnosticsWindow.cs"
      - "Launcher/src/NosGM.Launcher/MainWindow.Diagnostics.cs"
      - "scripts/verify-launcher-diagnostics-center.ps1"
      - "docs/launcher-diagnostics-center.md"
      - ".github/workflows/validate-launcher-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify diagnostics privacy contracts
        shell: powershell
        run: ./scripts/verify-launcher-diagnostics-center.ps1

      - name: Restore launcher
        run: dotnet restore Launcher/NosGM.Launcher.sln

      - name: Build launcher Release
        run: dotnet build Launcher/NosGM.Launcher.sln --configuration Release --no-restore
