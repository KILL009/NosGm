name: Windows .NET Framework build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSBuild Release / x64
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      SOLUTION: NosGm.sln
      CONFIGURATION: Release
      PLATFORM: x64
      ARTIFACTS: artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The legacy .NET Framework solution is built by Visual Studio 2022
      # MSBuild 17.14, which cannot load the repository-wide .NET 10 SDK.
      # Keep global.json on .NET 10, select only the SDK imports from .NET 9,
      # and disable the unused workload resolver exactly as local startup does.
      - name: Install .NET 9 compatibility SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Select compatible SDK imports for legacy MSBuild
        shell: pwsh
        run: |
          $sdkLine = dotnet --list-sdks |
            Where-Object { $_ -match '^9\.0\.' } |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($sdkLine)) {
            throw ".NET 9 compatibility SDK was not installed."
          }
          if ($sdkLine -notmatch '^([^\s]+)\s+\[(.+)\]$') {
            throw "Unable to parse installed SDK location: $sdkLine"
          }

          $sdkVersion = $Matches[1]
          $sdkBase = $Matches[2]
          $sdkPath = Join-Path (Join-Path $sdkBase $sdkVersion) "Sdks"
          if (-not (Test-Path -LiteralPath (Join-Path $sdkPath "Microsoft.NET.Sdk\Sdk") -PathType Container)) {
            throw "Microsoft.NET.Sdk was not found under $sdkPath"
          }

          "MSBuildSDKsPath=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBuildEnableWorkloadResolver=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Legacy job SDK imports: $sdkVersion"
          Write-Host "Legacy MSBuild SDK path: $sdkPath"
          Write-Host "Repository global.json remains on .NET 10; legacy workloads are disabled."

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Show build tools
        shell: pwsh
        run: |
          msbuild -version
          nuget help | Select-Object -First 1

      - name: Validate MSBuild packages.config restore fallback
        shell: powershell
        run: |
          msbuild "$env:SOLUTION" `
            /t:Restore `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:RestorePackagesConfig=true `
            /p:NosGmLegacyBuild=true `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform="$env:PLATFORM"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "$env:SOLUTION" -NonInteractive -Verbosity normal

      - name: Validate World x64 runtime settings
        shell: pwsh
        run: ./scripts/verify-world-runtime.ps1

      - name: Validate World RESX resources with MSBuild
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ARTIFACTS" | Out-Null
          $output = & msbuild "Data\NosGm.Program\NosGm.World\NosGm.World.csproj" `
            /t:PrepareResources `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:NosGmLegacyBuild=true `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform=x64 `
            /bl:"$env:ARTIFACTS\resx.binlog" `
            /fl `
            /flp:"logfile=$env:ARTIFACTS\resx.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build complete solution
        shell: pwsh
        run: |
          $output = & msbuild "$env:SOLUTION" `
            /t:Build `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:NosGmLegacyBuild=true `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform="$env:PLATFORM" `
            /bl:"$env:ARTIFACTS\build.binlog" `
            /fl `
            /flp:"logfile=$env:ARTIFACTS\build.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Verify server executable layout
        shell: powershell
        run: |
          $expectedExecutables = @(
            "bin\Release\Master\NosGm.Master.Server.exe",
            "bin\Release\World\NosGm.World.exe",
            "bin\Release\Login\NosGm.Login.exe"
          )
          foreach ($executable in $expectedExecutables) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Expected server executable was not produced: $executable"
            }
            Write-Host "[FOUND] $executable"
          }

      - name: Verify Master callback mirror interface dispatch
        shell: powershell
        run: ./scripts/verify-master-callback-mirror-interface-map.ps1

      - name: Verify compiled SCS callback observation ledger
        shell: powershell
        run: ./scripts/verify-scs-callback-observation-ledger-runtime.ps1

      - name: Verify password hashing behavior
        shell: powershell
        run: ./scripts/verify-password-hashing.ps1

      - name: Verify repaired login contracts
        shell: powershell
        run: ./scripts/verify-repaired-login.ps1

      - name: Verify stable Gameforge session contracts
        shell: powershell
        run: ./scripts/verify-gameforge-stable-session.ps1

      - name: Verify Gameforge Login parser runtime behavior
        shell: powershell
        run: ./scripts/verify-gameforge-login-parser-runtime.ps1

      - name: Verify bounded Gameforge ticket runtime behavior
        shell: powershell
        run: ./scripts/verify-gameforge-ticket-store-runtime.ps1

      - name: Verify modern NsTeST layout runtime behavior
        shell: powershell
        run: ./scripts/verify-nstest-modern-layout-runtime.ps1

      - name: Verify modern World session handshake runtime behavior
        shell: powershell
        run: ./scripts/verify-modern-world-session-handshake-runtime.ps1

      - name: Verify modern World frame-tail preservation
        shell: powershell
        run: ./scripts/verify-modern-world-frame-tail-runtime.ps1

      - name: Verify launcher authentication bridge contracts
        shell: powershell
        run: ./scripts/verify-launcher-auth-bridge.ps1

      - name: Verify modern login runtime activation contracts
        shell: powershell
        run: ./scripts/verify-modern-login-runtime-activation.ps1

      - name: Verify modern login observability contracts
        shell: powershell
        run: ./scripts/verify-modern-login-observability.ps1

      - name: Exercise modern login diagnostics redaction
        shell: powershell
        run: ./scripts/collect-modern-login-diagnostics.ps1 -SelfTest -MaxLogMegabytes 1 -MaxLogLines 100

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msbuild-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  diagnostics:
    name: Concise MSBuild failure report
    needs: build
    if: failure()
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Download build diagnostics
        uses: actions/download-artifact@v7
        with:
          name: windows-msbuild-diagnostics
          path: diagnostics

      - name: Print relevant errors
        shell: pwsh
        run: |
          $logs = Get-ChildItem diagnostics -Filter *.log -Recurse | Sort-Object Name
          if (-not $logs) { Write-Error "No MSBuild text logs were uploaded."; exit 1 }
          $found = $false
          foreach ($log in $logs) {
            $matches = Select-String -Path $log.FullName -Pattern "error [A-Z]+[0-9]+|error MSB[0-9]+|MSB[0-9]+:|ResX|resheader" -Context 1,2
            if ($matches) {
              $found = $true
              Write-Host "=== $($log.Name) ==="
              $matches | Select-Object -First 60 | ForEach-Object { Write-Host $_.ToString() }
            }
          }
          if (-not $found) {
            foreach ($log in $logs) {
              Write-Host "=== $($log.Name) (tail) ==="
              Get-Content $log.FullName -Tail 100
            }
          }
          exit 1
