name: One-time map stability codemod

on:
  push:
    branches:
      - agent/nosgm-next-map-stability

permissions:
  contents: write

concurrency:
  group: one-time-map-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codemod:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified map transformation
        shell: pwsh
        run: ./scripts/apply-map-stability-codemod.ps1

      - name: Commit transformed source when needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/NosGm.GameObject/Map/MapInstance.cs
          if (git diff --cached --quiet) {
            Write-Host "No source changes remain to commit."
            exit 0
          }
          git commit -m "fix: stabilize map lifecycle and diagnostics"
          git push origin HEAD:${{ github.ref_name }}
