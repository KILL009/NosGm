name: Validate NosGM.TimeSpaceParser

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-timespace-parser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and run synthetic self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore parser
        run: dotnet restore Tools/NosGM.TimeSpaceParser/NosGM.TimeSpaceParser.csproj

      - name: Build parser
        run: dotnet build Tools/NosGM.TimeSpaceParser/NosGM.TimeSpaceParser.csproj --configuration Release --no-restore

      - name: Run synthetic regression test
        run: dotnet run --project Tools/NosGM.TimeSpaceParser/NosGM.TimeSpaceParser.csproj --configuration Release --no-build -- self-test

      - name: Run attribution and safety checks
        shell: pwsh
        run: ./scripts/verify-timespace-parser.ps1
