name: Normalize map lifecycle source

on:
  push:
    branches:
      - agent/nosgm-next-map-lifecycle

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      !startsWith(github.event.head_commit.message, 'style: normalize map lifecycle line endings')
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/nosgm-next-map-lifecycle

      - name: Normalize accidental CRCRLF sequences
        shell: pwsh
        run: |
          $path = "Data/NosGm.GameObject/Map/MapInstance.cs"
          $content = [System.IO.File]::ReadAllText($path)
          while ($content.Contains("`r`r`n")) {
            $content = $content.Replace("`r`r`n", "`r`n")
          }
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($true))

          if ([System.IO.File]::ReadAllText($path).Contains("`r`r`n")) {
            throw "MapInstance.cs still contains CRCRLF sequences."
          }

          git diff --check
          if (-not (git status --short -- $path)) {
            throw "No line-ending cleanup was produced."
          }

      - name: Commit normalized source
        shell: pwsh
        run: |
          git config user.name "NosGM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- "Data/NosGm.GameObject/Map/MapInstance.cs"
          git commit -m "style: normalize map lifecycle line endings"
          git push origin HEAD:agent/nosgm-next-map-lifecycle
