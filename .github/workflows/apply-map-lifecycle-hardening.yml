name: Apply map lifecycle hardening

on:
  push:
    branches:
      - agent/nosgm-next-map-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: >-
      !startsWith(github.event.head_commit.message, 'fix: harden map lifecycle diagnostics') &&
      !startsWith(github.event.head_commit.message, 'diagnostic: capture map codemod failure')
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/nosgm-next-map-lifecycle

      - name: Apply source transformation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath map-codemod-error.txt -ErrorAction SilentlyContinue
          try {
            ./scripts/apply-map-lifecycle-hardening-v2.ps1
          }
          catch {
            $_ | Out-String | Set-Content -LiteralPath map-codemod-error.txt -Encoding UTF8
            git config user.name "NosGM Automation"
            git config user.email "actions@users.noreply.github.com"
            git add -- map-codemod-error.txt
            git commit -m "diagnostic: capture map codemod failure"
            git push origin HEAD:agent/nosgm-next-map-lifecycle
            throw
          }

      - name: Validate patch
        shell: pwsh
        run: |
          git diff --check
          if (-not (git status --short -- "Data/NosGm.GameObject/Map/MapInstance.cs")) {
            throw "MapInstance.cs was not changed by the transformation."
          }

      - name: Commit source change
        shell: pwsh
        run: |
          git config user.name "NosGM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- "Data/NosGm.GameObject/Map/MapInstance.cs"
          git commit -m "fix: harden map lifecycle diagnostics"
          git push origin HEAD:agent/nosgm-next-map-lifecycle
