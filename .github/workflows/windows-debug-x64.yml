name: Windows Debug x64 validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-debug-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-x64:
    name: MSBuild Debug / x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Prepare diagnostics and inspect stale metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $trackedGenerated = @(git ls-files | Where-Object { $_ -match '(^|/)(bin|obj)/' })
          "Tracked generated files: $($trackedGenerated.Count)" | Tee-Object -FilePath artifacts/generated-metadata.txt
          $trackedGenerated | Add-Content artifacts/generated-metadata.txt

          $frameworkHits = New-Object System.Collections.Generic.List[string]
          foreach ($file in (git ls-files '*.csproj' '*.props' '*.targets' '*.json')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }
            try {
              $matches = Select-String -LiteralPath $file -Pattern 'v4\.8\.1|net481' -AllMatches
              foreach ($match in $matches) {
                $frameworkHits.Add("$file:$($match.LineNumber):$($match.Line.Trim())")
              }
            }
            catch { }
          }
          "Tracked net481 references: $($frameworkHits.Count)" | Add-Content artifacts/generated-metadata.txt
          $frameworkHits | Add-Content artifacts/generated-metadata.txt

      - name: Remove all bin and obj directories
        shell: pwsh
        run: |
          $directories = @(Get-ChildItem -Path . -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin', 'obj') } |
            Sort-Object FullName -Descending)
          Write-Host "Removing $($directories.Count) generated directories."
          foreach ($directory in $directories) {
            Remove-Item -LiteralPath $directory.FullName -Recurse -Force
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $output = & nuget restore NosGm.sln -NonInteractive -Verbosity normal 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/restore.log | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Rebuild complete solution in Debug x64
        shell: pwsh
        run: |
          $output = & msbuild NosGm.sln `
            /t:Rebuild `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /bl:artifacts/debug-x64.binlog `
            /fl `
            /flp:"logfile=artifacts/debug-x64.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/build-console.log | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nosgm-debug-x64-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
