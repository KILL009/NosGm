name: Windows Debug x64 validation

on:
  push:
    branches:
      - fix/nosgm-debug-x64-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-x64:
    name: MSBuild Debug / x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply candidate framework alignment
        shell: pwsh
        run: |
          $project = 'Data/NosGm.Program/NosGm.Logger/NosGm.LogServer.csproj'
          $content = [System.IO.File]::ReadAllText($project)
          $updated = $content.Replace(
            '<TargetFrameworkVersion>v4.8.1</TargetFrameworkVersion>',
            '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>')
          if ($updated -eq $content) {
            Write-Host 'LogServer already targets .NET Framework 4.8.'
          }
          else {
            [System.IO.File]::WriteAllText($project, $updated, [System.Text.UTF8Encoding]::new($true))
            Write-Host 'Aligned NosGm.LogServer from .NET Framework 4.8.1 to 4.8.'
          }

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $output = & nuget restore NosGm.sln -NonInteractive -Verbosity detailed 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/restore.log | ForEach-Object { Write-Host $_ }
          "NuGetExitCode=$exitCode" | Out-File artifacts/restore-exit-code.txt
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build complete solution in Debug x64
        shell: pwsh
        run: |
          $output = & msbuild NosGm.sln `
            /t:Rebuild `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /bl:artifacts/debug-x64.binlog `
            /fl `
            /flp:"logfile=artifacts/debug-x64.log;verbosity=diagnostic" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/build-console.log | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Commit validated framework fix
        if: success() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- 'Data/NosGm.Program/NosGm.Logger/NosGm.LogServer.csproj')) {
            Write-Host 'No framework change needs to be committed.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Data/NosGm.Program/NosGm.Logger/NosGm.LogServer.csproj'
          git commit -m 'fix: align LogServer with .NET Framework 4.8'
          git push origin HEAD:fix/nosgm-debug-x64-build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nosgm-debug-x64-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
