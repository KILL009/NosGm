name: Windows Debug x64 validation

on:
  push:
    branches:
      - fix/nosgm-debug-x64-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-debug-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-x64:
    name: MSBuild Debug / x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/nosgm-debug-x64-build
          fetch-depth: 0

      - name: Align executable projects with .NET Framework 4.8.1
        shell: pwsh
        run: |
          $projects = @(
            'Data/NosGm.Program/NosGm.Logger/NosGm.LogServer.csproj',
            'Data/NosGm.Program/NosGm.Login/NosGm.Login.csproj',
            'Data/NosGm.Program/NosGm.Master.Server/NosGm.Master.Server.csproj',
            'Data/NosGm.Program/NosGm.World/NosGm.World.csproj'
          )

          foreach ($project in $projects) {
            $content = [System.IO.File]::ReadAllText($project)
            $updated = $content.Replace(
              '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>',
              '<TargetFrameworkVersion>v4.8.1</TargetFrameworkVersion>')
            if ($updated -ne $content) {
              [System.IO.File]::WriteAllText($project, $updated, [System.Text.UTF8Encoding]::new($true))
              Write-Host "Aligned $project to .NET Framework 4.8.1."
            }
          }

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Prepare diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Remove all bin and obj directories
        shell: pwsh
        run: |
          $directories = @(Get-ChildItem -Path . -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin', 'obj') } |
            Sort-Object FullName -Descending)
          foreach ($directory in $directories) {
            Remove-Item -LiteralPath $directory.FullName -Recurse -Force
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $output = & nuget restore NosGm.sln -NonInteractive -Verbosity normal 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/restore.log | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Rebuild complete solution in Debug x64
        shell: pwsh
        run: |
          $output = & msbuild NosGm.sln `
            /t:Rebuild `
            /m `
            /nologo `
            /nr:false `
            /v:minimal `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /bl:artifacts/debug-x64.binlog `
            /fl `
            /flp:"logfile=artifacts/debug-x64.log;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/build-console.log | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Commit validated framework alignment
        if: success() && github.event_name == 'push'
        shell: pwsh
        run: |
          $projects = @(
            'Data/NosGm.Program/NosGm.Logger/NosGm.LogServer.csproj',
            'Data/NosGm.Program/NosGm.Login/NosGm.Login.csproj',
            'Data/NosGm.Program/NosGm.Master.Server/NosGm.Master.Server.csproj',
            'Data/NosGm.Program/NosGm.World/NosGm.World.csproj'
          )
          if (-not (git status --porcelain -- $projects)) {
            Write-Host 'Framework alignment is already committed.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $projects
          git commit -m 'fix: align NosGm executables with .NET Framework 4.8.1'
          git push origin HEAD:fix/nosgm-debug-x64-build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nosgm-debug-x64-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
