name: Validate local smart repair channel

on:
  pull_request:
    paths:
      - "Launcher/src/NosGM.Launcher/LocalDevelopmentRepairChannel.cs"
      - "Launcher/src/NosGM.Launcher/MainWindow.LocalRepairChannel.cs"
      - "Launcher/src/NosGM.Launcher/TrustedChannel.cs"
      - "Launcher/src/NosGM.Updater.Core/ContentSources.cs"
      - "Web/src/NosGM.Web/LocalUpdateEndpoints.cs"
      - "Web/src/NosGM.Web/Program.cs"
      - "scripts/verify-launcher-smart-repair.ps1"
      - "docs/launcher-smart-repair.md"
      - "docs/local-smart-repair-fix.md"
      - ".github/workflows/validate-launcher-smart-repair.yml"
      - ".github/workflows/validate-local-smart-repair-channel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify smart repair contracts
        shell: powershell
        run: ./scripts/verify-launcher-smart-repair.ps1

      - name: Restore launcher
        run: dotnet restore Launcher/NosGM.Launcher.sln

      - name: Build launcher Release
        run: dotnet build Launcher/NosGM.Launcher.sln --configuration Release --no-restore

      - name: Build public portal Release
        run: dotnet build Web/src/NosGM.Web/NosGM.Web.csproj --configuration Release

      - name: Run updater regression suite
        run: dotnet run --project Launcher/tests/NosGM.Updater.SelfTest/NosGM.Updater.SelfTest.csproj --configuration Release --no-build
