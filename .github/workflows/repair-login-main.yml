name: Apply repaired login tree

on:
  push:
    branches:
      - fix/repair-login-main

permissions:
  contents: write

concurrency:
  group: apply-repaired-login-tree
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply repaired login tree onto current main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair target
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply verified repair branch files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/repair-login-integration
          git checkout origin/fix/repair-login-integration -- \
            .github/workflows/build-windows.yml \
            Data/NosGm.Configuration/ServerConfiguration.cs \
            Data/NosGm.Core/Handling/HandlerMethodReference.cs \
            Data/NosGm.Core/Handling/PacketAttribute.cs \
            Data/NosGm.Core/Language.cs \
            Data/NosGm.Handler/PacketHandler/CharScreen/EntryPointPacketHandler.cs \
            Data/NosGm.Handler/PacketHandler/Login/LoginPacketHandler.cs \
            Data/NosGm.Master.Library/Client/AuthentificationServiceClient.cs \
            Data/NosGm.Master.Library/Interface/IAuthentificationService.cs \
            Data/NosGm.Master.Library/NosGm.Master.Library.csproj \
            Data/NosGm.Master.Library/Security/GameforgeAuthTicketStore.cs \
            Data/NosGm.Master.Library/Security/GameforgeLoginPacketParser.cs \
            Data/NosGm.Master.Library/Security/GameforgeLoginPayload.cs \
            Data/NosGm.Master.Library/Security/GameforgeWorldPermitStore.cs \
            Data/NosGm.Program/NosGm.Login/Program.cs \
            Data/NosGm.Program/NosGm.Master.Server/AuthentificationService.cs \
            Data/NosGm.Program/NosGm.Master.Server/MSManager.cs \
            docs/localization.md \
            scripts/verify-client-region-map.ps1 \
            scripts/verify-gameforge-login-integration.ps1 \
            scripts/verify-login-outcomes.ps1 \
            scripts/verify-login-session-flow.ps1 \
            scripts/verify-world-channel-lists.ps1 \
            tests/fixtures/client-region-map.json \
            tests/fixtures/world-channel-lists.json

          git rm -f --ignore-unmatch \
            scripts/verify-gameforge-login-protocol.ps1 \
            scripts/verify-modern-login-packets.ps1
          git rm -f .github/workflows/repair-login-main.yml

          git config user.name "NosGM Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "fix: repair login integration on current main"
          git push origin HEAD:fix/repair-login-main
